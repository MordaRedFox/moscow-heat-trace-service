version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: heat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: heat_trace
      POSTGRES_USER: heat
      POSTGRES_PASSWORD: heat
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heat -d heat_trace"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Порт наружу публикуем для отладки через psql с хоста
    ports:
      - "5432:5432"

  # Spring Boot-приложение (Java 11, Ubuntu 22.04 Jammy)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: heat-trace-service:latest
    container_name: heat-trace-service
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/heat_trace
      SPRING_DATASOURCE_USERNAME: heat
      SPRING_DATASOURCE_PASSWORD: heat
      TZ: Europe/Moscow
    volumes:
      - heat_uploads:/var/tmp/heat
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
  heat_uploads:
