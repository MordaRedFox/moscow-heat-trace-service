server:
  port: 8080
  tomcat:
    max-swallow-size: -1
    connection-timeout: 120000

spring:
  flyway:
    enabled: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
        "[format_sql]": false
        jdbc:
          "[batch_size]": 500
          "[batch_versioned_data]": true
        "[order_inserts]": true
        "[order_updates]": true

  servlet:
    multipart:
      max-file-size: 3GB
      max-request-size: 3GB
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}/heat-multipart

heat:
  upload:
    temp-dir: ${java.io.tmpdir}/heat-uploads
    batch-size: 500
    error-log-limit: 20
    session-retention-days: 7

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{uploadId:-}] %-5level %logger{36} - %msg%n"
